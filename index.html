<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wealth Wizard</title>
  <meta name="description" content="Answer a few questions, get a money structure, then update it with big life moves — not daily spending." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23b794f4'/%3E%3Cstop offset='1' stop-color='%23f4a4c4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">Personal finance guide</p>
          <h1>Wealth Wizard</h1>
        </div>
      </div>
      <nav aria-label="Sections">
        <button type="button" data-view="home" class="active">Home</button>
        <button type="button" data-view="quiz">Setup</button>
        <button type="button" data-view="plan">My structure</button>
        <button type="button" data-view="moves">Big moves</button>
      </nav>
      <p class="privacy">For students and internationals starting out. Log big changes — jobs, visas, accounts, goals — not daily coffee. Answers stay in this browser.</p>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div>
          <p id="today-label" class="eyebrow"></p>
          <p class="net-mini" id="top-line">Structure first. Update when life moves.</p>
        </div>
        <button type="button" class="primary" id="primary-cta">Get started</button>
      </header>
      <div id="banner"></div>
      <main id="view"></main>
    </div>
  </div>

  <dialog id="composer" class="composer">
    <form id="composer-form">
      <header class="composer-head">
        <h2 id="composer-title">Log a big move</h2>
        <button type="button" class="ghost icon-btn" id="composer-close" aria-label="Close">×</button>
      </header>
      <div id="composer-fields" class="composer-fields"></div>
      <p id="composer-error" class="form-error" hidden></p>
      <footer class="composer-actions">
        <button type="button" class="ghost" id="composer-cancel">Cancel</button>
        <button type="submit" class="primary" id="composer-save">Save move</button>
      </footer>
    </form>
  </dialog>

  <script src="app.js?v=9"></script>
</body>
</html>
